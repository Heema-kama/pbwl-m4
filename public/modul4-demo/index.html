<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Konsumsi RESTful API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input, select, button { padding: .65rem; margin: .25rem 0; }
    input, select { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    form, section { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .message { white-space: pre-wrap; background: #f5f5f5; padding: .75rem; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; border-bottom: 1px solid #ddd; padding: .65rem; }
  </style>
</head>
<body>
  <h1>Demo Konsumsi RESTful API</h1>
  <p>Halaman ini menggunakan Fetch API untuk berkomunikasi dengan Laravel API.</p>

  <section>
    <h2>Login (Sanctum)</h2>
    <div class="grid">
      <label>Email<input id="email" type="email" value="admin@example.com"></label>
      <label>Password<input id="password" type="password" value="password123"></label>
    </div>
    <button id="loginButton">Login</button>
    <button id="logoutButton">Logout</button>
    <p id="authMessage" class="message">Belum login.</p>
  </section>

  <section>
    <h2>Tambah Mata Kuliah</h2>
    <form id="createForm">
      <div class="grid">
        <label>Program Studi
          <select id="program_studi_id" required></select>
        </label>
        <label>Kode Mata Kuliah<input id="kode_mk" required maxlength="20" value="SI901"></label>
        <label>Nama Mata Kuliah<input id="nama_mk" required maxlength="150" value="Pemrograman API"></label>
        <label>SKS<input id="sks" required type="number" min="1" max="6" value="3"></label>
        <label>Semester<input id="semester" required type="number" min="1" max="14" value="4"></label>
      </div>
      <button type="submit">Tambah Data</button>
    </form>
  </section>

  <section>
    <h2>Daftar Mata Kuliah</h2>
    <button id="reloadButton">Muat Data</button>
    <p id="message" class="message">Siap memuat data.</p>
    <table>
      <thead><tr><th>ID</th><th>Kode</th><th>Nama</th><th>SKS</th><th>Program Studi</th><th>Aksi</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
